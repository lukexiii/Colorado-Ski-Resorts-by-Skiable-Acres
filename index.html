<!DOCTYPE html>
<html>
<head>
<meta charset=utf-8 />
<title>Perceptual Circle Scaling</title>
<meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />

<style>

<body>
    <div id='map'></div>
    <div id='title-box'>
    <h1>Colorado Ski Resorts</h1>
    <h3>By Skiable Acres, 2026</h3>
    </div>


<script src="https://code.jquery.com/jquery-2.1.4.min.js"></script>
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>

//Styling the Page and Adding the Basemap

<style>
  body {
    margin:0;
    padding:0;
    font-family:
    sans-serif;
    }

 #title-box {
    position: absolute;
    left: 72px;
    top: 10px;
    width: 350px;
    padding: 8px 12px;
    background: rgba(0, 179, 255, 0.95);
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    border-radius: 3px;
    color: whitesmoke;
    text-align: center;
    z-index: 800;
    box-sizing: border-box;
}

#title-box h1 {
    position: static;
    margin: 0;
    padding: 0;
    background: none;
    box-shadow: none;
    color: whitesmoke;
    font-size: 2em;
}

#title-box h3 {
    position: static;
    margin: 3px 0 0;
    padding: 0;
    background: none;
    box-shadow: none;
    color: whitesmoke;
    font-size: 1em;
    font-weight: normal;
}

  #map {
    position:absolute;
    top:0;
    bottom:0;
    width:100%;
   }

   

.size-legend {
    background: white;
    padding: 5px 7px;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    font-size: 11px;
    line-height: 1.3;
    width: 120px;
    box-sizing: border-box;
}


</style>

<script>
    //map center and zoom
    var map = L.map('map', {
        center: [38.82, -106.5],
        zoom: 7.5,
        zoomSnap: 0.5
    });

    //basemap
    var Stadia_StamenTerrain = L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_terrain/{z}/{x}/{y}{r}.{ext}', {
        minZoom: 0,
        maxZoom: 18,
        attribution: '&copy; <a href="https://www.stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://www.stamen.com/" target="_blank">Stamen Design</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        ext: 'png'
    }).addTo(map);
    var OpenSnowMap_pistes = L.tileLayer('https://tiles.opensnowmap.org/pistes/{z}/{x}/{y}.png', {
        minZoom: 9,
        maxZoom: 18,
        attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors & ODbL, &copy; <a href="https://www.opensnowmap.org/iframes/data.html">www.opensnowmap.org</a> <a href="https://creativecommons.org/licenses/by-sa/2.0/">CC-BY-SA</a>'
    }).addTo(map);

//Adding and scaling my circles

states = L.geoJson.ajax("Assets/data.geojson",{
    attribution: 'Data: Wikipedia - Comparison of Colorado Ski Resorts, Map: LUKE PHELPS',
    pointToLayer: function (feature, x){
      return L.circleMarker(x, {
        color: '#0000FF',
        opacity: 1,
        weight: 2,
        fillColor: '#87CEEB',
        fillOpacity: .6,
        radius: calcRadius(feature.properties["Skiable area (acres)"])
      })
    .bindTooltip(
            feature.properties.Name +
            '<br>Skiable acres: ' + feature.properties["Skiable area (acres)"] +
            '<br>Max elevation: ' + feature.properties["Top elevation (feet)"] +
            '<br>Vertical drop: ' + feature.properties["Vertical (feet)"] +
            '<br>Run count: ' + feature.properties["Runs"]
            
        )
        .on({
            mouseover: function(e) {
                this.setStyle({
                    color: '#0000FF',
                    fillColor: '#0000FF'
                  });
            },
            mouseout: function(e) {
                this.setStyle({
                    color: '#0000FF',
                    fillColor: '#87CEEB'
                });
            }
        });
    }
});
	
var maxValue = 5317;
var maxRadius = 30;

function calcRadius(value) {
    value = Number(String(value).replace(/,/g, ''));
    return Math.sqrt(value / maxValue) * maxRadius;
}

L.control.scale({position: 'bottomleft'}).addTo(map);


var sizeLegend = L.control({position: 'bottomright'});

sizeLegend.onAdd = function (map) {
    var div = L.DomUtil.create('div', 'size-legend');

    var minAcres = 680;
    var maxAcres = 5317;

    var minRadius = calcRadius(minAcres);
    var maxRadius = calcRadius(maxAcres);


div.innerHTML =
    '<strong>Skiable Acres</strong>' +
    '<svg width="100" height="65" style="display:block; margin:auto;">' +
    '<circle cx="50" cy="32" r="' + maxRadius +
    '" fill="#87CEEB" fill-opacity="0.6" stroke="#0000FF" />' +
    '<circle cx="50" cy="51" r="' + minRadius +
    '" fill="#87CEEB" fill-opacity="0.6" stroke="#0000FF" />' +
    '</svg>' +
    '<div>Min: ' + minAcres.toLocaleString() + ' acres</div>' +
    '<div>Max: ' + maxAcres.toLocaleString() + ' acres</div>';
    return div;
};

sizeLegend.addTo(map);


states.addTo(map);

</script>
